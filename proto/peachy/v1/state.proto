syntax = "proto3";

package peachy.v1;

// What a state_changed event names. Values outside this list belong to surfaces
// that are not part of this protocol release; ignore them.
enum StateDomain {
  reserved 2 to 4, 6 to 13, 15 to 16, 19, 21, 24;
  STATE_DOMAIN_UNSPECIFIED = 0;

  // The caller's own profile (GetMe).
  STATE_DOMAIN_PROFILE = 1;

  // Sessions and devices (ListSessions, ListDevices).
