language = "C"
include_guard = "PEACHY_MLS_H"
pragma_once = false
cpp_compat = true
documentation = true
documentation_style = "doxy"
tab_width = 2
style = "type"
sort_by = "None"
after_includes = ""
header = """
/* SPDX-License-Identifier: MIT */

/* peachy_mls.h — the C ABI of peachy-mls-cabi.
 *
 * GENERATED by cbindgen from mls/cabi/src/lib.rs. Do not edit by hand: the
 * header is committed so that a Swift or Kotlin wrapper can be written without
 * a Rust toolchain in the loop, and `cargo test -p peachy-mls-cabi` fails if it
 * has drifted from the source. To regenerate it, run
 *
 *     cd mls && cargo test -p peachy-mls-cabi --test header
 *
 * and, if it fails, the `cp` command it prints, which names the header
 * cbindgen wrote under Cargo's OUT_DIR.
 *
 * docs/mls-core.md has the whole story.
 */"""

[defines]
# The test issuer is `#[cfg(feature = "test-issuer")]` in the source, and this
# mapping turns that into `#if defined(PEACHY_MLS_TEST_ISSUER)` in the header.
# One committed header then describes both builds, so `tests/header.rs` holds
# whether the feature is on or off — two headers would mean one of them was
# always the stale one.
"feature = test-issuer" = "PEACHY_MLS_TEST_ISSUER"
# And the golden-fixture door, the same way. Two features, two defines, still
# ONE committed header: `tests/header.rs` runs with both on and with neither,
# and the file it checks has to describe every build or the drift test would
# only be true of whichever set the last developer used.
"feature = fixture" = "PEACHY_MLS_FIXTURE"

[export]
include = [
  "PeachyMlsBuffer",
  "PeachyMlsIncoming",
  "PeachyMlsClient",
  "PeachyMlsTestIssuer",
]

[parse]
parse_deps = false

[enum]
prefix_with_name = true
