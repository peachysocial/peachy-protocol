# SPDX-License-Identifier: MIT
# cargo-fuzz targets for the parsers and openers that bytes from the server or
# another member cross (docs/mls-core.md §Fuzzing). Its own workspace,
# outside mls/Cargo.toml's: libFuzzer needs a nightly toolchain and sanitizer
# flags that the workspace's pinned stable build and the bindings must
# never see.
#
# Thirty-three targets (docs/mls-core.md §Fuzzing has the table), and
# `fuzz_targets/common/` the devices the ones that drive a real client share.
# A scheduled job runs each for a bounded time every day. From the
# repository root, write a starting corpus from the golden fixtures, then run a
# target, here for a minute:
#
#   cargo run --manifest-path mls/Cargo.toml -p peachy-mls-core --features fixture \
#     --example fuzz_seeds -- mls/fuzz/corpus
#   cargo +nightly fuzz run --fuzz-dir mls/fuzz envelope_open -- -max_total_time=60
#
# `cargo +nightly fuzz list --fuzz-dir mls/fuzz` lists the targets. The corpus
# directory is in this crate's .gitignore.

[package]
name = "peachy-mls-fuzz"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/peachysocial/peachy-protocol"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
# `test-issuer`: `call_envelope_open` builds a real two-member group so it can
# drive `Client::open_call_signal`, the door every call byte goes through, and
# `credential_parse` signs payloads with the test issuer. `fixture` (which
# implies it) opens the fixed-nonce sealers that `account_store_open` and
# `account_key_box_open` seal with.
peachy-mls-core = { path = "../core", features = ["fixture"] }
# `string_list` reads the C door's list codec, behind the cabi's `fuzzing`
# feature, which ships in no archive.
peachy-mls-cabi = { path = "../cabi", features = ["fuzzing"] }
# The same pins as mls/Cargo.toml: `call_ring_step` drives the reducer's JSON
# door, and `group_meta` reads and writes a group context's extensions.
serde_json = "=1.0.145"
openmls = { version = "=0.9.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
tls_codec = "=0.5.0"
# `call_grant_sealed` seals a raw plaintext with HPKE exactly as a media grant
# is sealed, and `welcome_gap_block` a raw plaintext with AES-256-GCM exactly as
# a gap block is, so the checks after each open see bytes no sealer writes;
# `call_envelope_open` signs the fuzzer's live frames with a member's leaf key.
# The same pins and features as mls/Cargo.toml and mls/core/Cargo.toml.
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "envelope_open"
path = "fuzz_targets/envelope_open.rs"
test = false
doc = false
bench = false

